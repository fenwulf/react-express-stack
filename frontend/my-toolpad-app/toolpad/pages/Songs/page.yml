# yaml-language-server: $schema=https://raw.githubusercontent.com/mui/toolpad/v0.8.1/docs/schemas/v1/definitions.json#properties/Page

apiVersion: v1
kind: page
spec:
  title: Songs
  display: shell
  authorization:
    allowAll: true
  content:
    - component: DataGrid
      name: dataGrid
      props:
        dataProviderId: songProvider.ts:default
        columns:
          - field: song_id
            type: number
          - field: song_title
            type: string
        rowIdField: song_id
        density: compact
        rowsSource: dataProvider
      layout:
        height: 360
    - component: Text
      name: text
      props:
        value: Add Song
    - component: Form
      name: form
      props:
        hasResetButton: false
        formControlsFullWidth: false
        submitButtonText: Add Song
      children:
        - component: Container
          name: container
          children:
            - component: PageRow
              name: pageRow
              props:
                justifyContent: start
              children:
                - component: TextField
                  name: textFieldSongTitle
                  props:
                    label: Song title
                    placeholder: Title of song
                    name: song_title
                    size: small
                    isRequired: true
                - component: codeComponent.MyComponent
                  name: dynamicAutoCompleteNumArtistSelect
  maxWidth: lg
